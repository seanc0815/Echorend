<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>幻痛之刃</title>
<style>
html,body{margin:0;height:100%;background:#05050a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:#eee}

#pad{position:absolute;left:calc(62px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.16);pointer-events:auto}

/* 手機直拿時把整個遊戲轉 90 度，強制橫向（2026-10-17）；手機鎖定直向也能玩 */
body.rot #wrap,body.rot #touch,body.rot #menu{inset:auto;top:0;left:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
</style>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="touch">
  <div id="pad"><div id="knob"></div></div>
  <div class="tb" data-k="jump" style="right:20px;bottom:22px;width:68px;height:68px">跳</div>
  <div class="tb" data-k="atk" style="right:100px;bottom:14px;width:66px;height:66px">斬</div>
  <div class="tb" data-k="hvy" style="right:30px;bottom:100px">重</div>
  <div class="tb" data-k="dodge" style="right:176px;bottom:12px">閃</div>
  <div class="tb" data-k="parry" style="right:104px;bottom:92px">擋</div>
  <div class="tb sm" id="bPause" style="right:14px;top:12px">❚❚</div>
</div>
<div id="menu"></div>
<script>
'use strict';
// 《幻痛之刃》（2026-10-26 照組員企畫書定名；曾名「斷界」「餘響」，檔案與網址仍叫 echorend）：2D 貓咪劇情動作遊戲，第一章。
let VW = 480; const VH = 270, STEP = 1 / 120, FLOOR = 232, AW = 1100, G = 1700, RUN = 165;
const DODGE = .26, PARRY = .18;     // 彈反窗口 0.22 秒（原 .17；配合出手前 0.32 秒的亮光提示）
const GLINT = .32;                  // 出手前多久亮白光＋「叮」：看到後約 0.1～0.3 秒內按彈反都接得到
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), menu = $('menu');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, sgn = v => v > 0 ? 1 : v < 0 ? -1 : 0, rnd = (a, b) => a + Math.random() * (b - a);
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');

let K = 1, CSS = 1;
const BRK_HIT = .3;              // 普通攻擊削界限的倍率
let ROT = false;                           // 手機直拿 → 畫面整個轉 90 度
// 手機的安全區域（瀏海、狀態列、Home 條）：用一個看不見的元素量出來
const insetProbe = document.createElement('div');
insetProbe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
document.body.appendChild(insetProbe);
function insets() { const c = getComputedStyle(insetProbe); return { t: parseFloat(c.paddingTop) || 0, r: parseFloat(c.paddingRight) || 0, b: parseFloat(c.paddingBottom) || 0, l: parseFloat(c.paddingLeft) || 0 }; }
function resize() {
  ROT = isTouch && innerHeight > innerWidth;
  document.body.classList.toggle('rot', ROT);
  // 2026-10-17：手機上避開狀態列／Home 條，並讓遊戲畫面依螢幕比例變寬來填滿（不再留兩側黑邊）
  const ins = insets();
  const W = ROT ? innerHeight - ins.t - ins.b : innerWidth - (isTouch ? ins.l + ins.r : 0), H = ROT ? innerWidth : innerHeight;
  for (const el of [$('wrap'), $('touch'), menu]) {
    if (ROT) { el.style.top = ins.t + 'px'; el.style.left = '0px'; el.style.right = ''; el.style.bottom = ''; el.style.width = W + 'px'; el.style.height = H + 'px'; }
    else if (isTouch) { el.style.top = '0px'; el.style.left = ins.l + 'px'; el.style.right = ''; el.style.bottom = ''; el.style.width = W + 'px'; el.style.height = H + 'px'; }
    else { el.style.top = el.style.left = el.style.width = el.style.height = el.style.right = el.style.bottom = ''; }
  }
  VW = isTouch ? clamp(Math.round(VH * W / H), 480, 640) : 480;    // 畫面寬度（遊戲世界單位）：手機上跟著螢幕比例
  CSS = Math.min(W / VW, H / VH); K = CSS * (devicePixelRatio || 1);
  cv.width = Math.round(VW * K); cv.height = Math.round(VH * K);
  cv.style.width = Math.round(VW * CSS) + 'px'; cv.style.height = Math.round(VH * CSS) + 'px';
}

// ---------- 狀態 ----------
let scene = 'title', paused = false, T = 0;
let P, enemies = [], parts = [], fx = [], texts = [];
let hitstop = 0, slowT = 0, shake = 0, shakeX = 0, shakeY = 0, zoom = 0, flash = 0, gray = 0, letter = 0;
let cam = 0, wave = 0, waveT = 0, waveBanner = 0, combo = 0, comboT = 0, best = 0, deadT = 0;
let stats = { parry: 0, perfect: 0, exec: 0, kills: 0 }, pending = [], tut = null;
let SK = { hvy: true, dodge: true, parry: true, exec: true };   // 可用的技能（劇情模式逐步解鎖）
let story = null, projs = [], noiseT = 0, THEME = null;
let sfxs = [];          // 畫面座標的特效（彈反的集中線、斷響的紅線斷裂、「斷」字）
const KB = {}, TOUCH = {}, IN = {};
let Q = {}, PR = {};
const take = k => !!PR[k];

// ---------- 招式表 ----------
// box: [前緣起, 前緣止, 上, 下]（相對腳底、朝向）；arc: 刀光 半徑/起訖角/高度
const ATK = {
  L1: { dur: .25, a0: .05, a1: .11, dmg: 9, brk: 8, kb: 120, stop: .03, shake: 3, lunge: 95, box: [2, 46, -36, -4], arc: [30, -1.25, 1.05, -19], next: 'L2', pitch: 1 },
  L2: { dur: .25, a0: .05, a1: .11, dmg: 10, brk: 8, kb: 120, stop: .03, shake: 3, lunge: 95, box: [2, 46, -36, -4], arc: [30, 1.05, -1.2, -21], next: 'L3', pitch: 1.1 },
  L3: { dur: .3, a0: .06, a1: .13, dmg: 12, brk: 10, kb: 150, stop: .04, shake: 4, lunge: 115, box: [0, 50, -42, -2], arc: [35, -1.7, 1.35, -19], next: 'L4', pitch: .95 },
  L4: { dur: .5, a0: .13, a1: .21, dmg: 24, brk: 20, kb: 340, kby: -170, stop: .08, shake: 8, lunge: 170, box: [-4, 58, -46, 0], arc: [44, -2.5, 1.45, -21], fin: true, pitch: .75 },
  H: { dur: .44, a0: .1, a1: .18, dmg: 16, brk: 14, kb: 25, kby: -430, stop: .05, shake: 5, lunge: 50, box: [-2, 46, -64, 0], arc: [40, 1.7, -2.0, -14], launch: true, pitch: .8 },
  A1: { air: true, dur: .22, a0: .04, a1: .1, dmg: 8, brk: 7, kb: 45, kby: -210, stop: .03, shake: 2, lunge: 45, box: [0, 46, -38, 2], arc: [30, -1.2, 1.1, -18], next: 'A2', pitch: 1.15 },
  A2: { air: true, dur: .22, a0: .04, a1: .1, dmg: 8, brk: 7, kb: 45, kby: -210, stop: .03, shake: 2, lunge: 45, box: [0, 46, -38, 2], arc: [30, 1.1, -1.2, -20], next: 'A3', pitch: 1.25 },
  U: { dur: .24, a0: .04, a1: .11, dmg: 9, brk: 8, kb: 20, kby: -260, stop: .03, shake: 2, lunge: 0, box: [-24, 24, -66, -14], arc: [30, -2.7, -.45, -22], pitch: 1.2 },
  D: { air: true, pogo: true, dur: .26, a0: .03, a1: .2, dmg: 9, brk: 8, kb: 20, kby: 140, stop: .03, shake: 2, lunge: 0, box: [-20, 20, -8, 34], arc: [30, .45, 2.7, -14], pitch: 1.1 },
  A3: { air: true, dur: .34, a0: .07, a1: .14, dmg: 13, brk: 11, kb: 230, kby: -60, stop: .05, shake: 5, lunge: 70, box: [-2, 52, -42, 4], arc: [38, -2.2, 1.3, -18], fin: true, pitch: .9 },
};

// ---------- 玩家 ----------
function newPlayer() {
  return { x: 200, y: FLOOR, w: 14, h: 36, vx: 0, vy: 0, face: 1, ground: true, hp: 100, max: 100, atk: null, queue: null, last: null, chainT: 0,
    airJumps: 1, airAtk: 0, recT: 0, recV: 0, dodgeT: 0, dodgeCD: 0, dodgeDir: 1, parryT: 0, parryCD: 0, parryLag: 0, hurtT: 0, inv: 0, slam: false,
    exec: null, ghosts: [], run: 0, scarf: [] };
}
const pBox = () => ({ x: P.x - 7, y: P.y - 36, w: 14, h: 36 });

function startAtk(name) {
  const d = ATK[name], dir = (IN.r ? 1 : 0) - (IN.l ? 1 : 0);
  if (dir) P.face = dir;
  else {
    // 前面沒有敵人、後面很近有 → 自動轉身
    let fr = 1e9, bk = 1e9;
    for (const e of enemies) if (!e.dead) { const dx = (e.x - P.x) * P.face; if (dx > -10 && dx < fr) fr = dx; if (dx <= -10 && -dx < bk) bk = -dx; }
    if (fr > 80 && bk < 70) P.face *= -1;
  }
  P.atk = { name, d, t: 0, hit: new Set() }; P.queue = null; P.last = name;
  if (d.air && !d.pogo) { P.airAtk++; P.vy = Math.min(P.vy, -70); }
  sfx('swing', d.pitch, d.fin ? 1.4 : 1);
}

function updPlayer(dt) {
  const dir = (IN.r ? 1 : 0) - (IN.l ? 1 : 0);
  P.bladeFlash = (P.bladeFlash || 0) - dt; P.pdT = (P.pdT || 0) - dt / Math.max(.3, slowT > 0 ? .3 : 1); P.dodgeCD -= dt; P.parryCD -= dt; P.parryT -= dt; P.parryLag -= dt; P.hurtT -= dt; P.inv -= dt; P.chainT -= dt; P.recT -= dt;
  if (P.hp <= 0) { P.vx *= .9; P.vy += G * dt; P.y = Math.min(FLOOR, P.y + P.vy * dt); P.x += P.vx * dt; return; }

  const busy = P.hurtT > 0 || P.parryLag > 0;
  // 斷響：重攻擊鍵，附近有崩壞的敵人
  if (take('hvy') && !busy && SK.hvy) {
    const tgt = enemies.filter(e => !e.dead && e.state === 'broken' && Math.abs(e.x - P.x) < 95 && Math.abs(e.y - P.y) < 70).sort((a, b) => Math.abs(a.x - P.x) - Math.abs(b.x - P.x))[0];
    if (tgt && SK.exec) { startExec(tgt); return; }
    if (!P.atk || P.atk.t > P.atk.d.a1) {
      if (P.ground) startAtk('H');
      else { P.atk = null; P.slam = true; P.vy = 980; P.vx = 0; sfx('swing', .6, 1.3); }
    }
  }
  if (take('dodge') && SK.dodge && P.dodgeCD <= 0 && !P.slam && P.hurtT <= 0) {
    P.atk = null; P.queue = null; P.parryT = 0; P.parryLag = 0;
    P.dodgeT = DODGE; P.dodgeCD = .38; P.dodgeDir = dir || P.face;        // 沒按方向 → 往前衝（Gabi 2026-10-17）
    if (dir) P.face = dir;
    P.vy = 0;                                           // 衝刺只走水平（空洞騎士式：衝刺期間沒有重力）
    sfx('dodge');
  }
  if (take('parry') && SK.parry && P.parryCD <= 0 && P.dodgeT <= 0 && !P.slam && P.hurtT <= 0 && (!P.atk || P.atk.t > P.atk.d.a1)) {
    P.atk = null; P.parryT = PARRY; P.parryCD = .5; P.parryLag = PARRY + .16;
    if (dir) P.face = dir;
  }
  if (take('atk') && !busy && P.dodgeT <= 0 && !P.slam) {
    if (P.atk) { if (P.atk.t > .07 && P.atk.d.next) P.queue = P.atk.d.next; }
    else if (IN.d && !P.ground) startAtk('D');          // 空中下劈：打到會彈起（空洞騎士的 pogo）
    else if (IN.u) startAtk('U');                        // 上斬
    else if (P.ground) startAtk(P.chainT > 0 && P.last && ATK[P.last].next && !ATK[P.last].air ? ATK[P.last].next : 'L1');
    else if (P.airAtk < 4) startAtk(P.chainT > 0 && P.last && ATK[P.last].air && ATK[P.last].next ? ATK[P.last].next : 'A1');
  }
  if (take('jump') && !busy && !P.slam) {
    if (P.ground) { P.vy = -560; P.jumpCut = true; P.ground = false; P.atk = null; sfx('jump', 1); dust(P.x, FLOOR, 6); if (tut) tut.jumped = true; }
    else if (P.airJumps > 0) { P.airJumps--; P.vy = -480; P.jumpCut = true; P.atk = null; sfx('jump', 1.3); ring(P.x, P.y, '#9fe8ff', 18); if (tut) tut.djumped = true; }
  }

  // 水平移動
  if (P.dodgeT > 0) {
    P.dodgeT -= dt; P.vx = P.dodgeDir * 400 * Math.sqrt(Math.max(0, P.dodgeT / DODGE)) + P.dodgeDir * 40;
    if (Math.random() < .5) P.ghosts.push({ x: P.x, y: P.y, f: P.face, a: .55 });
  } else if (P.slam) P.vx = 0;
  else if (P.atk && dir) P.vx = dir * RUN * .9;          // 空洞騎士式：揮刀時照常移動（面向不變）
  else if (P.atk) {
    const d = P.atk.d;
    let lunge = d.lunge;
    for (const e of enemies) if (!e.dead && Math.abs(e.y - P.y) < 50) { const dx = (e.x - P.x) * P.face; if (dx > 0 && dx < e.w / 2 + 16) lunge = 0; }
    P.vx = P.atk.t < d.a1 ? P.face * lunge * (1 - P.atk.t / d.a1) : P.vx * .82;
  } else if (P.parryLag > 0 || P.hurtT > 0) P.vx *= .85;
  else if (P.ground) { P.vx = dir * RUN; if (dir) P.face = dir; }
  else { P.vx += (dir * RUN - P.vx) * Math.min(1, dt * 10); if (dir) P.face = dir; }

  if (P.recT > 0 && P.dodgeT <= 0) P.vx += P.recV;     // 命中反作用力
  // 垂直
  let gs = 1;
  if (P.atk && P.atk.d.air) gs = P.atk.d.pogo ? 1 : .55;
  if (P.dodgeT > 0) { gs = 0; P.vy = 0; }
  // 長短按決定跳躍高度（2026-10-17）：上升中放開跳鍵 → 立刻收掉大部分上升速度。短按約一半高、按住到最高
  if (P.jumpCut && !IN.jump && P.vy < -200) { P.vy = -200; P.jumpCut = false; }
  if (P.vy >= 0) P.jumpCut = false;                       // 到頂了就不再處理（下劈彈起、被打飛不受影響）
  if (!P.slam) P.vy += G * gs * dt;
  P.y += P.vy * dt; P.x = clamp(P.x + P.vx * dt, 14, AW - 14);
  if (P.dodgeT <= 0 && !P.exec) {                        // 身體碰撞：走不進敵人身體裡（閃避可以穿過）
    for (const e of enemies) {
      if (e.dead || e.state === 'spawn' || e.state === 'air') continue;
      const min = e.w / 2 + P.w / 2 - 2, dx = P.x - e.x;
      if (Math.abs(dx) < min && P.y > e.y - e.h && P.y - P.h < e.y) {
        const push = (min - Math.abs(dx)) * (sgn(dx) || -P.face);
        P.x = clamp(P.x + push * .7, 14, AW - 14); e.x = clamp(e.x - push * .3, 16, AW - 16);
      }
    }
  }
  const wasAir = !P.ground;
  if (P.y >= FLOOR) {
    P.y = FLOOR;
    if (wasAir) {
      P.airJumps = 1; P.airAtk = 0;
      if (P.slam) { P.slam = false; slamImpact(); }
      else if (P.vy > 300) dust(P.x, FLOOR, 5);
      if (P.atk && P.atk.d.air) P.atk = null;
    }
    P.vy = 0; P.ground = true;
  } else P.ground = false;
  if (P.ground && P.vx) P.run += dt * 14;

  // 攻擊判定
  if (P.atk) {
    const A = P.atk, d = A.d; A.t += dt;
    if (!A.waved && (A.name === 'L4' || A.name === 'A3') && A.t >= d.a0) {     // 第四段／空中終結：放出一道刀氣（視覺）
      A.waved = true; fx.push({ k: 'wave', x: P.x + P.face * 20, y: P.y + d.arc[3], dir: P.face, t: 0, life: .32 });
      sfx('swing', .7, 1.6);
    }
    if (A.t >= d.a0 && A.t <= d.a1 && Math.random() < .6) {               // 刀尖掉落的光點
      const [r, a0, a1, oy] = d.arc, k = clamp((A.t - d.a0) / (d.a1 - d.a0), 0, 1), ang = a0 + (a1 - a0) * k;
      part({ x: P.x + P.face * Math.cos(ang) * r, y: P.y + oy + Math.sin(ang) * r, vx: rnd(-30, 30), vy: rnd(-40, 10), life: rnd(.15, .35), c: Math.random() < .5 ? '#ffffff' : '#9fe8ff', r: rnd(1, 2), g: 120 });
    }
    if (A.t >= d.a0 && A.t <= d.a1) {
      const x0 = P.face > 0 ? P.x + d.box[0] : P.x - d.box[1];
      const hb = { x: x0, y: P.y + d.box[2], w: d.box[1] - d.box[0], h: d.box[3] - d.box[2] };

        A.hit.add(e); hitEnemy(e, d, P.face);
